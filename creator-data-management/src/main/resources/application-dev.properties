spring.application.name=creator-data-management

spring.datasource.url=${INFLUENCER_DB_URL}
spring.datasource.username=${INFLUENCER_DB_USERNAME}
spring.datasource.password=${INFLUENCER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${DASH_SCOPE_API_KEY}
spring.ai.openai.base-url=${DASH_SCOPE_BASE_URL}
spring.ai.openai.chat.options.model=${DASH_SCOPE_CHAT_MODEL}

# 保持与前端一致的字段命名（snake_case）
spring.jackson.property-naming-strategy=SNAKE_CASE